  hl=en-GB. Reduced to the [data-item-id] rows, which is all parser-level2
  reads. Instrumentation attributes and images stripped.

  What this fixture pins:
    - the pane is hydrated (address, phone and plus code all present) and
      carries NO [data-item-id="authority"], so website must resolve to a
      proven "none" rather than "unknown"
    - the phone is readable straight from the attribute
      (data-item-id="phone:tel:09967797857"), not from the rendered text

      "Address: " prefix is localised
    - price-band rows carry data-item-id="0".."2", so "any data-item-id present"
      is a weak hydration signal on its own; the parser requires the pane's
      aria-label as well
-->
