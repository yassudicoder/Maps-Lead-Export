<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maps Lead Export</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app">
      <header class="hd">
        <span class="hd-dot" id="stateDot" aria-hidden="true"></span>
        <div class="hd-text">
          <h1 class="hd-title" data-i18n="panelTitle">Maps Lead Export</h1>
          <p class="hd-status" id="statusLine" role="status" aria-live="polite"></p>
        </div>
        <output class="hd-count" id="count" aria-live="off">0</output>
      </header>

      <details class="filters" id="filters">
        <summary class="filters-summary">
          <span data-i18n="filtersTitle">Filters</span>
          <span class="filters-badge" id="filtersBadge"></span>
          <span class="diag-caret" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="10" height="10">
              <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </summary>

        <div class="filters-body">
          <div class="fgroup">
            <span class="flabel" data-i18n="filterWebsite">Website</span>
            <div class="segmented" id="websiteSeg" role="group">
              <button type="button" data-website="any" data-i18n="filterAny">Any</button>
              <button type="button" data-website="none" data-i18n="websiteNone">No website</button>
              <button type="button" data-website="unknown" data-i18n="filterUnknown">Unknown</button>
              <button type="button" data-website="has" data-i18n="websiteHas">Website</button>
            </div>
          </div>

          <div class="fgrid">
            <label class="fnum">
              <span data-i18n="filterMaxRating">Rating at most</span>
              <input type="number" id="fMaxRating" min="0" max="5" step="0.1" inputmode="decimal" />
            </label>
            <label class="fnum">
              <span data-i18n="filterMaxReviews">Reviews under</span>
              <input type="number" id="fMaxReviews" min="0" step="1" inputmode="numeric" />
            </label>
            <label class="fnum">
              <span data-i18n="filterRadius">Within km</span>
              <input type="number" id="fRadius" min="0" step="0.5" inputmode="decimal" />
            </label>
          </div>

          <div class="fgrid">
            <label class="ftext">
              <span data-i18n="filterCategory">Category contains</span>
              <input type="text" id="fCategory" autocomplete="off" />
            </label>
            <label class="ftext">
              <span data-i18n="filterName">Name contains</span>
              <input type="text" id="fName" autocomplete="off" />
            </label>
          </div>

          <label class="fcheck">
            <input type="checkbox" id="fKeepUnknown" checked />
            <span data-i18n="filterKeepUnknown">Keep rows where the value is unknown</span>
          </label>

          <label class="fcheck" id="fExcludeExportedRow" hidden>
            <input type="checkbox" id="fExcludeExported" checked />
            <span data-i18n="filterExcludeExported">Hide places I exported before</span>
          </label>

          <div class="presets" id="presetsRow" hidden>
            <span class="flabel" data-i18n="presetsTitle">Saved filters</span>
            <div class="preset-chips" id="presetChips"></div>
          </div>

          <div class="filters-foot">
            <span class="filters-count" id="filtersCount"></span>
            <button type="button" class="btn btn-quiet" id="presetSave" data-i18n="presetSave">
              Save
            </button>
            <button type="button" class="btn btn-quiet" id="filtersReset" data-i18n="filterReset">
              Reset
            </button>
          </div>

          <div class="preset-name" id="presetNameRow" hidden>
            <input type="text" id="presetName" maxlength="60" autocomplete="off" />
            <button type="button" class="btn" id="presetConfirm" data-i18n="presetConfirm">
              Save
            </button>
            <button type="button" class="btn btn-quiet" id="presetCancel" data-i18n="btnClearNo">
              Keep
            </button>
          </div>
        </div>
      </details>

      <div class="banner" id="banner" hidden>
        <div class="banner-body">
          <p class="banner-title" id="bannerTitle"></p>
          <p class="banner-text" id="bannerText"></p>
        </div>
        <button type="button" class="btn btn-quiet" id="bannerAction" hidden></button>
      </div>

      <!-- Full-panel states: shown instead of the list when there is nothing
           to show yet, or nowhere to collect from. -->
      <section class="state" id="stateView" hidden>
        <div class="state-art" id="stateArt" aria-hidden="true"></div>
        <h2 class="state-title" id="stateTitle"></h2>
        <p class="state-text" id="stateText"></p>
        <button type="button" class="btn btn-primary" id="stateAction" hidden></button>
      </section>

      <div class="resolve" id="resolve" hidden>
        <span class="resolve-dot" id="resolveDot" aria-hidden="true"></span>
        <p class="resolve-text" id="resolveText"></p>
      </div>

      <main class="list" id="list" hidden tabindex="-1">
        <div class="list-sizer" id="sizer"></div>
      </main>

      <footer class="ft">
        <!-- One press, one place. Deliberately singular: there is no batch
             control here and none is planned (red lines 2 and 8). -->
        <button type="button" class="btn btn-accel" id="openNext" hidden>
          <span class="accel-label" data-i18n="btnOpenNext">Open next unenriched</span>
          <span class="accel-count" id="openNextCount"></span>
        </button>

        <div class="ft-actions">
          <button type="button" class="btn btn-primary" id="exportBtn" data-i18n="btnExport">
            Export CSV
          </button>
          <button type="button" class="btn btn-icon" id="copyBtn">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="5.5" y="2.5" width="8" height="10" rx="1.5" fill="none"
                stroke="currentColor" stroke-width="1.3" />
              <path d="M10.5 13.5v.5a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5V5.5A1.5 1.5 0 0 1 4 4h.5"
                fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="btn btn-icon" id="columnsBtn">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="2.5" y="3" width="3.4" height="10" rx="1" fill="none"
                stroke="currentColor" stroke-width="1.3" />
              <rect x="7.3" y="3" width="3.4" height="10" rx="1" fill="none"
                stroke="currentColor" stroke-width="1.3" />
              <rect x="12.1" y="3" width="1.4" height="10" rx="0.7" fill="currentColor" opacity="0.4" />
            </svg>
          </button>
          <button type="button" class="btn btn-icon" id="pauseBtn" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" id="pauseIcon">
              <rect x="4" y="3" width="3" height="10" rx="1" fill="currentColor" />
              <rect x="9" y="3" width="3" height="10" rx="1" fill="currentColor" />
            </svg>
          </button>
          <button type="button" class="btn btn-icon" id="clearBtn">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path
                d="M3 4.5h10M6.5 4V2.8h3V4M4.5 4.5l.6 8.2a1 1 0 0 0 1 .8h3.8a1 1 0 0 0 1-.8l.6-8.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <!-- Clear is destructive and the session is not recoverable, so it
             confirms inline rather than behind a modal. -->
        <div class="confirm" id="confirm" hidden>
          <p class="confirm-text" id="confirmText"></p>
          <div class="confirm-actions">
            <button type="button" class="btn btn-quiet" id="confirmNo" data-i18n="btnClearNo">
              Keep
            </button>
            <button type="button" class="btn btn-danger" id="confirmYes" data-i18n="btnClearYes">
              Clear
            </button>
          </div>
        </div>

        <!-- Column picker. Inline rather than a dialog: the panel is small and
             a modal over a 320px strip is worse than a list you can scroll. -->
        <div class="columns" id="columnsPanel" hidden>
          <p class="columns-title" data-i18n="columnsTitle">Columns to export</p>
          <div class="columns-list" id="columnsList"></div>
          <div class="columns-foot">
            <button type="button" class="btn btn-quiet" id="columnsAll" data-i18n="columnsAll">
              Select all
            </button>
            <button type="button" class="btn btn-quiet" id="columnsDefault" data-i18n="columnsDefault">
              Defaults
            </button>
            <button type="button" class="btn btn-quiet" id="columnsDone" data-i18n="columnsDone">
              Done
            </button>
          </div>
        </div>

        <details class="diag" id="diag">
          <summary class="diag-summary">
            <span class="diag-health" id="healthLine"></span>
            <span class="diag-caret" aria-hidden="true">
              <svg viewBox="0 0 12 12" width="10" height="10">
                <path
                  d="M3 4.5 6 7.5 9 4.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </summary>
          <dl class="diag-grid" id="diagGrid"></dl>
          <button type="button" class="btn btn-quiet diag-copy" id="copyDiag" data-i18n="btnCopyDiag">
            Copy diagnostics
          </button>
          <p class="diag-promise" data-i18n="promiseLine"></p>
        </details>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- Cloned per visible row by the virtual list. Values are always set with
         textContent, never markup. -->
    <template id="rowTemplate">
      <div class="row" role="button" tabindex="0">
        <div class="row-top">
          <span class="row-exported" hidden></span>
          <span class="row-name"></span>
          <span class="row-rating"><span class="star">&#9733;</span><span class="row-rating-val"></span></span>
        </div>
        <div class="row-bottom">
          <span class="row-meta"></span>
          <span class="pill"></span>
        </div>
        <div class="row-contact">
          <span class="row-phone"></span>
          <span class="row-site"></span>
          <span class="row-status" title=""></span>
        </div>
      </div>
    </template>

    <script src="../common/constants.js"></script>
    <script src="../common/text.js"></script>
    <script src="../common/geo.js"></script>
    <script src="../common/filters.js"></script>
    <script src="../common/presets.js"></script>
    <script src="../common/csv.js"></script>
    <script src="../common/entitlements.js"></script>
    <script src="virtual-list.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
